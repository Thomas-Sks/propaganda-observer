# Dépendances locales uniquement (api et web tournent en natif pendant le dev).
name: propaganda-observer
services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: observer
      POSTGRES_PASSWORD: observer
      POSTGRES_DB: observer
    ports: ["5442:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
  redis:
    image: redis:7-alpine
    ports: ["6380:6379"]
volumes:
  pgdata:
