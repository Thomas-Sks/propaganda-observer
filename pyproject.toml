[project]
name = "propaganda-observer"
version = "0.1.0"
description = "Live cross-platform detection of coordinated propaganda and source provenance scoring"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "sqlalchemy[asyncio]>=2.0",
  "asyncpg>=0.30",
  "pgvector>=0.3",
  "redis>=5.2",
  "arq>=0.26",
  "httpx>=0.28",
  "pyyaml>=6.0",
  "anthropic>=0.40",
  "openai>=1.55",
  "datasketch>=1.6",
  "rapidfuzz>=3.10",
  "networkx>=3.4",
  "feedparser>=6.0",
  "tldextract>=5.1",
  "sse-starlette>=2.1",
  "numpy>=2.5.4",
  "yt-dlp>=2026.10.26",
  "telethon>=1.45.0",
  "apify-client>=3.5.1",
  "beautifulsoup4>=4.15.0",
  "scikit-learn>=1.9.1",
  "dnstwist>=20250130",
  "whoisit>=4.1.0",
  "pandas>=3.1.1",
  "pyarrow>=26.0.1",
]

[dependency-groups]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "ruff>=0.8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["observer"]

[tool.ruff]
line-length = 110

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
