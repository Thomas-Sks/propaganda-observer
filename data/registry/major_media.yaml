# Grands médias susceptibles d'être imités (typosquat / faux sites type Doppelganger, Storm-1516, CopyCop).
# Mondial et multilingue : on ajoute des lignes, jamais de code. Utilisé par observer/tools/provenance.py::lookalike_of.
# Champs : domain (domaine enregistrable), name, country (ISO 3166-1 alpha-2), lang (ISO 639-1),
#   generic: true si la marque est un mot courant (« pravda », « zeit », « abc ») : seules les permutations dnstwist
#   comptent alors, pas l'échange de TLD ni l'ajout d'un préfixe/suffixe (sinon faux positifs : pravda.ru, zeit.com…)
